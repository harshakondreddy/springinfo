<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpringInfo Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="options-wrap">
      <h1>SpringInfo</h1>
      <p class="subhead">Configure request behavior and default table visibility.</p>

      <section class="card">
        <h2>Performance</h2>

        <label class="row">
          <span>Request timeout (milliseconds)</span>
          <input type="number" id="requestTimeoutMs" min="2000" step="500" />
        </label>

        <label class="row">
          <span>Info auto-close delay (milliseconds)</span>
          <input type="number" id="infoAutoCloseMs" min="250" step="100" />
        </label>
      </section>

      <section class="card">
        <h2>Default view</h2>
        <label class="row checkbox"><input type="checkbox" id="hideAmis" /><span>Hide AMIs column by default</span></label>
        <label class="row checkbox"><input type="checkbox" id="hideZones" /><span>Hide Zones column by default</span></label>
        <label class="row checkbox"><input type="checkbox" id="hideOtherTables" /><span>Hide other non-registry tables by default</span></label>
        <label class="row checkbox"><input type="checkbox" id="enableDiagnostics" /><span>Enable diagnostics (show Copy Debug button)</span></label>
      </section>

      <section class="card">
        <h2>URL fallback strategy</h2>
        <label class="row">
          <span>Fallback mode</span>
          <select id="fallbackMode">
            <option value="none">None (use link as-is)</option>
            <option value="https-upgrade">Try HTTPS for HTTP links</option>
            <option value="skip-insecure">Skip insecure HTTP links on HTTPS page</option>
          </select>
        </label>
      </section>

      <div class="actions">
        <button id="saveBtn" type="button">Save</button>
        <button id="resetBtn" type="button" class="secondary">Reset defaults</button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </main>

    <script src="options.js"></script>
  </body>
</html>
